<!DOCTYPE html>
<html>
<head>
    <title>Absensi Acara Tahunan Indo World</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; transition: 0.3s; }
        input { padding: 10px; font-size: 18px; width: 300px; text-align: center; }
        .status { margin-top: 20px; font-size: 24px; font-weight: bold; }
        .success { background-color: #d4edda; color: #155724; }
        .warning { background-color: #fff3cd; color: #856404; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body id="bg">
    <h2>SILAHKAN SCAN KARTU</h2>
    <input type="text" id="rfid" autofocus onkeypress="process(event)">
    <div id="msg" class="status">Menunggu Scan...</div>

    <script>
       // 1. Fungsi penangkap harus ada di scope global (paling luar)
function handleResponse(data) {
    const msg = document.getElementById('msg');
    const bg = document.getElementById('bg');
    
    msg.innerText = data.pesan;
    if (data.status === "success") bg.className = "success";
    else if (data.status === "warning") bg.className = "warning";
    else bg.className = "error";

    // Bersihkan elemen script setelah selesai
    const oldScript = document.getElementById('api-call');
    if (oldScript) oldScript.remove();
}

function process(e) {
    if (e.key === "Enter") {
        const inputField = document.getElementById('rfid');
        const id = inputField.value;
        const msg = document.getElementById('msg');
        const url = "URL_WEB_APP_BARU_ANDA"; // Masukkan URL hasil deploy terakhir

        if (!id) return;
        msg.innerText = "Memproses...";
        
        // 2. Teknik JSONP Injection (Pasti lolos ORB)
        const script = document.createElement('script');
        script.id = 'api-call';
        script.src = `${url}?id=${encodeURIComponent(id)}&timestamp=${new Date().getTime()}`;
        document.body.appendChild(script);

        inputField.value = ""; 
        inputField.focus();
    }
}
    </script>
</body>
</html>
